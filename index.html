<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="admaven-placement" content="Bqjs4rdrF">
    <title>CANSLIM Resources</title>
    <style>
        :root {
            --google-blue: #1a73e8;
            --text: #202124;
            --muted: #5f6368;
            --border: #dadce0;
            --bg: #ffffff;
            --tab-border: #d2e3fc;
            --url-green: #137333;
            --result-title: #1a0dab;
            --card-bg: #ffffff;
            --hover-shadow: 0 1px 4px rgba(60,64,67,.2);
            --banner-bg: #f8f9fa;
        }
        body.dark-mode {
            --google-blue: #8ab4f8;
            --text: #e8eaed;
            --muted: #9aa0a6;
            --border: #3c4043;
            --bg: #202124;
            --tab-border: #3c4043;
            --url-green: #81c995;
            --result-title: #8ab4f8;
            --card-bg: #2b2c2f;
            --hover-shadow: 0 1px 4px rgba(0,0,0,.5);
            --banner-bg: #2b2c2f;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--text);
            background: var(--bg);
        }
        a { color: var(--result-title); text-decoration: none; }
        a:hover { text-decoration: underline; }
        .hidden { display: none !important; }

        .page {
            width: min(1180px, 100%);
            margin: 0 auto;
            padding: 16px 16px 36px;
        }
        .topbar {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        .brand {
            font-size: 28px;
            font-weight: 600;
            color: #4285f4;
            letter-spacing: -0.02em;
            line-height: 1;
            white-space: nowrap;
        }
        .search-wrap {
            flex: 1;
            min-width: 260px;
            position: relative;
        }
        .search-input {
            width: 100%;
            height: 46px;
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 0 18px;
            font-size: 16px;
            outline: none;
            box-shadow: 0 1px 2px rgba(60,64,67,.1);
        }
        .search-input:focus {
            border-color: transparent;
            box-shadow: 0 1px 6px rgba(32,33,36,.28);
        }
        .search-hint {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 13px;
        }
        .top-controls {
            margin-left: auto;
        }
        .theme-toggle {
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            border-radius: 18px;
            padding: 8px 12px;
            font-size: 13px;
            cursor: pointer;
        }
        .theme-toggle:hover {
            box-shadow: var(--hover-shadow);
        }

        .tabs {
            display: flex;
            gap: 2px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 18px;
            flex-wrap: wrap;
        }
        .tab {
            border: none;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            padding: 12px 14px;
            font-size: 14px;
            border-bottom: 3px solid transparent;
        }
        .tab.active {
            color: var(--google-blue);
            border-bottom-color: var(--google-blue);
            font-weight: 600;
        }
        .tab-link {
            display: inline-flex;
            align-items: center;
            color: var(--muted);
            padding: 12px 14px;
            font-size: 14px;
            border-bottom: 3px solid transparent;
        }

        .page-loader {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
            color: var(--muted);
            font-size: 13px;
        }
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid #d2e3fc;
            border-top-color: var(--google-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        .page-loader.hidden { display: none; }

        .content { display: none; }
        .content.active { display: block; }

        .result-meta {
            color: var(--muted);
            font-size: 14px;
            margin: 0 0 16px;
        }
        .link-list { list-style: none; padding: 0; margin: 0; }
        .link-list li {
            margin-bottom: 20px;
            max-width: 720px;
        }
        .link-title {
            font-size: 20px;
            color: var(--result-title);
            text-decoration: none;
            font-weight: 400;
            display: block;
            margin-bottom: 3px;
        }
        .link-url {
            color: var(--url-green);
            font-size: 14px;
            display: block;
            margin-bottom: 5px;
            word-break: break-word;
        }
        .empty-state {
            color: var(--muted);
            font-size: 14px;
            margin: 12px 0;
        }

        .pdf-grid,
        .youtube-grid,
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 14px;
        }
        #twitter-posts { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }

        .pdf-card,
        .media-card,
        .gallery-item,
        .twitter-card {
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--card-bg);
            padding: 10px;
        }
        .pdf-card:hover,
        .media-card:hover,
        .gallery-item:hover,
        .twitter-card:hover {
            box-shadow: var(--hover-shadow);
        }
        .pdf-thumb {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border: 1px solid #f1f3f4;
            border-radius: 6px;
        }
        .pdf-title {
            margin-top: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            line-height: 1.3;
        }
        .media-card h3 {
            margin: 0 0 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }
        .youtube-placeholder {
            padding: 0;
            border: 1px solid #f1f3f4;
            border-radius: 6px;
            background: #000;
            cursor: pointer;
            width: 100%;
            position: relative;
            overflow: hidden;
        }
        .youtube-placeholder img {
            display: block;
            width: 100%;
            height: auto;
        }
        .youtube-play {
            position: absolute;
            inset: 0;
            margin: auto;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            color: #fff;
            background: rgba(0,0,0,.55);
            font-size: 20px;
        }
        .media-card iframe,
        .twitter-embed,
        .video-player {
            width: 100%;
            min-height: 220px;
            border: 0;
            border-radius: 6px;
            background: #000;
        }
        .twitter-fallback,
        .media-caption,
        .gallery-item a {
            margin-top: 8px;
            display: inline-block;
            color: var(--muted);
            font-size: 13px;
        }
        .video-load-button {
            width: 100%;
            min-height: 220px;
            margin-top: 8px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: linear-gradient(135deg, #111827, #1f2937);
            color: #fff;
            font-size: 15px;
            cursor: pointer;
        }
        .video-load-button:hover {
            filter: brightness(1.08);
        }
        .gallery-item img,
        .gallery-item video {
            width: 100%;
            border-radius: 6px;
        }

        .lightbox {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .lightbox.hidden { display: none; }
        .lightbox:not(.hidden) { display: flex; }
        .lightbox-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
        }
        .lightbox-inner {
            position: relative;
            background: var(--card-bg);
            border-radius: 10px;
            padding: 12px;
            max-width: 92vw;
            max-height: 92vh;
            z-index: 1;
            overflow: auto;
        }
        .lightbox-inner img {
            display: block;
            max-width: 86vw;
            max-height: 78vh;
            margin: 0 auto;
        }
        .lightbox-inner p {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 13px;
        }
        .lightbox-close {
            position: absolute;
            right: 6px;
            top: 2px;
            border: none;
            background: transparent;
            font-size: 28px;
            color: var(--muted);
            cursor: pointer;
        }
        .support-banner {
            position: fixed;
            right: 16px;
            top: 140px;
            width: 220px;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            background: var(--banner-bg);
            z-index: 40;
        }
        .support-banner h4 {
            margin: 0 0 6px;
            font-size: 14px;
        }
        .support-banner p {
            margin: 0 0 10px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.4;
        }
        .support-banner a {
            display: inline-block;
            color: #fff;
            background: var(--google-blue);
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 12px;
            text-decoration: none;
        }
        .support-banner a:hover {
            filter: brightness(1.06);
            text-decoration: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @media (max-width: 720px) {
            .brand { font-size: 24px; }
            .link-title { font-size: 18px; }
            .tabs { margin-bottom: 12px; }
            .top-controls {
                margin-left: 0;
            }
            .support-banner {
                position: static;
                width: auto;
                margin: 0 0 12px;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <header class="topbar">
            <div class="brand" aria-label="CANSLIM Search">CANSLIM</div>
            <div class="search-wrap">
                <input id="search-input" class="search-input" type="search" placeholder="Search CANSLIM resources" aria-label="Search resources">
                <p id="search-status" class="search-hint">Showing all resources</p>
            </div>
            <div class="top-controls">
                <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">Dark mode</button>
            </div>
        </header>

        <aside class="support-banner" aria-label="Support the community">
            <h4>Support the Community</h4>
            <p>Help keep this CANSLIM archive updated for everyone.</p>
            <a href="https://ko-fi.com/summary/fa1b9058-2736-45ee-9e98-e8b1a960be9e" target="_blank" rel="noopener noreferrer">Support on Ko-fi</a>
        </aside>

        <div id="page-loader" class="page-loader">
            <div class="spinner"></div>
            <p>Loading resources...</p>
        </div>

        <nav class="tabs" aria-label="Resource tabs">
            <button class="tab active" data-tab="home" onclick="showTab(event, 'home')">All</button>
            <button class="tab" data-tab="pdfs" onclick="showTab(event, 'pdfs')">PDFs</button>
            <button class="tab" data-tab="youtube" onclick="showTab(event, 'youtube')">Videos</button>
            <button class="tab" data-tab="twitter" onclick="showTab(event, 'twitter')">X</button>
            <button class="tab" data-tab="images" onclick="showTab(event, 'images')">Images</button>
            <button class="tab" data-tab="videos" onclick="showTab(event, 'videos')">Discord Videos</button>
            <a class="tab-link" href="https://discord.gg/xUz3nXZ3p5" target="_blank" rel="noopener noreferrer">Discord</a>
            <a class="tab-link" href="https://discord.gg/xUz3nXZ3p5" target="_blank" rel="noopener noreferrer">Support</a>
        </nav>

        <section id="home" class="content active">
            <p class="result-meta">All indexed links</p>
            <ol id="other-links" class="link-list"></ol>
        </section>

        <section id="pdfs" class="content">
            <p class="result-meta">PDF documents</p>
            <div id="pdf-list" class="pdf-grid"></div>
        </section>

        <section id="youtube" class="content">
            <p class="result-meta">YouTube resources</p>
            <div id="youtube-videos" class="youtube-grid"></div>
        </section>

        <section id="twitter" class="content">
            <p class="result-meta">X / Twitter posts</p>
            <div id="twitter-posts" class="youtube-grid"></div>
        </section>

        <section id="images" class="content">
            <p class="result-meta">Image gallery</p>
            <div id="images-gallery" class="gallery"></div>
        </section>

        <section id="videos" class="content">
            <p class="result-meta">Discord video gallery</p>
            <div id="videos-gallery" class="gallery"></div>
        </section>
    </main>

    <div id="image-lightbox" class="lightbox hidden">
        <div class="lightbox-overlay" data-lightbox-close></div>
        <div class="lightbox-inner">
            <button class="lightbox-close" aria-label="Close image preview" data-lightbox-close>&times;</button>
            <img id="lightbox-photo" src="" alt="Enlarged preview">
            <p id="lightbox-caption"></p>
        </div>
    </div>

    <script defer src="main.js"></script>
</body>
</html>
